name: Deploy Application

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  build:
    name: Build Solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore BlazorPWA.sln

      - name: Build solution
        run: dotnet build BlazorPWA.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test BlazorPWA.sln --configuration Release --no-build --verbosity normal
        continue-on-error: true

      - name: Publish API
        run: dotnet publish src/BlazorPWA.API/BlazorPWA.API.csproj -c Release -o publish/api --no-build

      - name: Publish Client
        run: dotnet publish src/BlazorPWA.Client/BlazorPWA.Client.csproj -c Release -o publish/client --no-build

      - name: Publish Worker
        run: dotnet publish src/BlazorPWA.Worker/BlazorPWA.Worker.csproj -c Release -o publish/worker --no-build

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish/api

      - name: Upload Client artifact
        uses: actions/upload-artifact@v4
        with:
          name: client
          path: publish/client

      - name: Upload Worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker
          path: publish/worker

  deploy-api:
    name: Deploy API
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: api

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-api-blazorpwa-${{ env.ENVIRONMENT }}
          package: api

  deploy-client:
    name: Deploy Client PWA
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Download Client artifact
        uses: actions/download-artifact@v4
        with:
          name: client
          path: client

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-client-blazorpwa-${{ env.ENVIRONMENT }}
          package: client

  deploy-worker:
    name: Deploy Worker
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Download Worker artifact
        uses: actions/download-artifact@v4
        with:
          name: worker
          path: worker

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-worker-blazorpwa-${{ env.ENVIRONMENT }}
          package: worker
